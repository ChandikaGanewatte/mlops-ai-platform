version: "3.8"

services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ml_api
    working_dir: /app
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ml_dashboard
    working_dir: /app
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"